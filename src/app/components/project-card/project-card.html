<div class="project-card">
  <div class="project-image">
    <img [src]="project.imageUrl" [alt]="project.title">
  </div>
  <div class="project-content">
    <h3>{{project.title}}</h3>
    <p>{{project.description}}</p>
    <div class="technologies">
      <span *ngFor="let tech of project.technologies" class="tech-tag">{{tech}}</span>
    </div>
    <div class="project-links">
      <a [href]="project.githubUrl" target="_blank" rel="noopener noreferrer" class="btn btn-github">
        <i class="fab fa-github"></i> View Code
      </a>
      <a *ngIf="project.liveUrl" [href]="project.liveUrl" target="_blank" rel="noopener noreferrer" class="btn btn-live">
        <i class="fas fa-external-link-alt"></i> Live Demo
      </a>
    </div>
  </div>
</div>
