<div class="project-card">
  <div class="project-image">
    <img [src]="project.imageUrl" [alt]="project.title" loading="lazy">
    <div class="project-overlay">
      <div class="project-links">
        <a [href]="project.githubUrl" target="_blank" rel="noopener noreferrer" class="btn btn-github" aria-label="View project source code">
          <i class="fab fa-github"></i>
          <span>View Code</span>
        </a>
        <a *ngIf="project.liveUrl" [href]="project.liveUrl" target="_blank" rel="noopener noreferrer" class="btn btn-live" aria-label="View live demo">
          <i class="fas fa-external-link-alt"></i>
          <span>Live Demo</span>
        </a>
      </div>
    </div>
  </div>
  <div class="project-content">
    <h3>{{project.title}}</h3>
    <p>{{project.description}}</p>
    <div class="technologies">
      <span *ngFor="let tech of project.technologies" class="tech-tag">
        <img *ngIf="getTechLogo(tech)" [src]="getTechLogo(tech)" [alt]="tech + ' logo'" class="tech-logo" loading="lazy">
        {{tech}}
      </span>
    </div>
  </div>
</div>
