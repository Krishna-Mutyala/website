name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # or master, depending on your default branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Use Node.js 20.19.0
      uses: actions/setup-node@v4
      with:
        node-version: '20'   # Angular CLI now requires >= 20.19
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Build Angular app
      run: npm run build     # Don't append --configuration production here

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: dist/browser  # Adjust if your Angular output folder differs
        branch: gh-pages
        repository-name: Krishna-Mutyala/website
